<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#fbf7ef">
  <meta name="description" content="Hermos Cafe dijital menüsü">
  <title>Hermos Cafe | Menü</title>
  <link rel="icon" type="image/png" href="assets/hermos-logo-transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img class="logo" src="assets/hermos-logo-transparent.png" alt="Hermos Cafe">
      <span class="digital-label">DİJİTAL MENÜ</span>
      <button class="search-button" id="searchToggle" type="button" aria-label="Menüde ara" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      </button>
    </div>
    <div class="search-panel" id="searchPanel">
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="searchInput" type="search" placeholder="Bu kategoride ara" autocomplete="off">
      </div>
    </div>
  </header>

  <section class="welcome" aria-label="Hermos Cafe">
    <img src="assets/hermos-hero.png" alt="Kahve ve kruvasan sunumu">
    <div class="welcome-overlay"></div>
    <div class="welcome-copy">
      <span>HERMOS CAFE · GEDİZ</span>
      <h1>Lezzete kısa<br>bir mola.</h1>
      <p>Kahve, mutfak ve tatlı seçeneklerimizi keşfedin.</p>
    </div>
  </section>

  <nav class="category-nav" id="categoryNav" aria-label="Menü kategorileri"></nav>

  <main class="menu-shell">
    <div class="menu-heading">
      <div>
        <p class="section-label">SEÇİLİ KATEGORİ</p>
        <h2 id="activeCategoryTitle">Kahveler</h2>
      </div>
      <span id="productCount"></span>
    </div>
    <div class="product-list" id="productList"></div>
    <div class="empty-state" id="emptyState">
      <strong>Ürün bulunamadı</strong>
      <span>Başka bir kelimeyle tekrar deneyebilirsiniz.</span>
    </div>
  </main>

  <footer>
    <img src="assets/hermos-logo-transparent.png" alt="Hermos Cafe">
    <p>Fiyatlarımıza KDV dahildir.</p>
  </footer>

  <dialog class="product-modal" id="productModal">
    <button class="modal-close" id="modalClose" type="button" aria-label="Kapat">×</button>
    <p class="modal-category" id="modalCategory"></p>
    <h3 id="modalName"></h3>
    <p class="modal-description" id="modalDescription"></p>
    <div class="modal-price"><span>Fiyat</span><strong id="modalPrice"></strong></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
